<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ username }}'s messages</title>
</head>
<body>
  <h1>NoBackdoorMessaging</h1>
  <h4>Signed in as {{ username }}</h4>

  <h3 class="error">
    {% if error %}
            {{ error }}
    {% endif %}
  </h3>

  <p>
    {% for message in messages %}
        Sender:  {{message[0]}}
        Message: {{message[1]}}
    {% endfor %}

  </p>

  


</body>
</html>

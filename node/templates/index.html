<body class="landing-body">

  <!-- scene is generated procedurally in ascii-bg.js, so it fills any viewport -->

    <h1 class="logo">
      <span class="logo-line">NoBackdoor</span>

      <a class="btn btn-primary" href="/register">REGISTER</a>
      <a class="btn" href="/login">LOGIN</a>

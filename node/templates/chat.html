<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ username }}'s chat</title>
</head>
<body>
  <h1>NoBackdoorMessaging</h1>
  <h4>Signed in as {{ username }}</h4>

  <h3 class="error">
    {% if error %}
            {{ error }}
    {% endif %}
    </h3>

  <div>
    {% for name in logs %}
      <a href="/conversation/{{ name }}" style="display:block; width:300px; padding:12px; margin-bottom:8px; border:1px solid #444; text-decoration:none; color:inherit;">
        {{ name }}
      </a>
    {% endfor %}
  </div>

  <form method="POST" action="/send">
    <input type="text" name="to" placeholder="Username to message" required>
    <input type="text" name="message" placeholder="Your message" required>
    <button type="submit">Send</button>
  </form>

  <form method="POST" action="/collect">
    <input type="hidden" name="isHomeScreen" value="y">
    <button type="submit">Refresh all messages</button>
  </form>


</body>
</html>
